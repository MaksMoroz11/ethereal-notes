services:
  db:
    ports: !reset []

  backend:
    ports: !reset []
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env}

  frontend:
    ports: !reset []
    build:
      args:
        VITE_API_URL: ""

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.server.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SSL_CERT_FILE:-./certs/fullchain.pem}:/etc/nginx/certs/fullchain.pem:ro
      - ${SSL_KEY_FILE:-./certs/privkey.pem}:/etc/nginx/certs/privkey.pem:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
